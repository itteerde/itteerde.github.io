<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connections – Chains of Asmodeus</title>
<link rel="stylesheet" href="../css/aetherial.css">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  #graph {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
  }
</style>
</head>
<body data-root="../">
    <div id="graph" data-graphscape data-theme="dark" data-dimension="2d"></div>
    <script>
      const fiveMinBucket = Math.floor(Date.now() / (5 * 60 * 1000));
      const thirtyMinBucket = Math.floor(Date.now() / (5 * 60 * 1000));
      document.getElementById('graph').setAttribute('data-src', 'graphs/all.json?t=' + fiveMinBucket);
      document.getElementById('graph').setAttribute('data-config', 'graphs/skin.json?t=' + thirtyMinBucket);
    </script>
    <script src="../../graphscale/standalone/graphscape.standalone.js"></script>
</body>
</html>
